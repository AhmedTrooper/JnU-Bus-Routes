name: Build Production Release

on:
  push:
    branches:
      - release

jobs:
  build:
    name: Build & Release App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze & Test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/app/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/key.properties
          echo "storeFile=upload-keystore.jks" >> android/app/key.properties

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_name=jnu_bus_routes" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AppBundle
        run: flutter build appbundle --release

      - name: Rename Release Artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ steps.version.outputs.app_name }}_v${{ steps.version.outputs.version }}.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/${{ steps.version.outputs.app_name }}_v${{ steps.version.outputs.version }}.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.app_name }}_v${{ steps.version.outputs.version }}_apk
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.app_name }}_v${{ steps.version.outputs.version }}.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.app_name }}_v${{ steps.version.outputs.version }}_aab
          path: build/app/outputs/bundle/release/${{ steps.version.outputs.app_name }}_v${{ steps.version.outputs.version }}.aab

      # Optional: Clean up secrets for extra safety (though ephemeral runners die anyway)
      - name: Clean up Keystore & Properties
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/app/key.properties
